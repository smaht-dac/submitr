# Build for submitr

name: INTEGRATION TESTS

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: # Needed for OIDC authentication; also lets us request an OIDC token below
  id-token: write
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: TEST INTEGRATION WITH PYTHON ${{ matrix.python_version }}

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python_version: [3.11]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: BUILD
        run: |
          make build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      # The integration tests actually talk to AWS S3 and Google Cloud Storage (GCS);
      # both directly (via Python boto3 and google.cloud.storage) and via rclone.
      - name: INTEGRATION TESTS
        env:
          # AWS access is via the role assumed above (OIDC); the action exports
          # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN/AWS_DEFAULT_REGION for us.
          #
          # AWS_OIDC_ROLE_ARN is additionally passed through because part of what these tests
          # exercise is the minting of scoped, short-lived credentials for a specific bucket/key.
          # That is done with sts:AssumeRoleWithWebIdentity against this same role, using an
          # inline session policy; see AwsS3._generate_temporary_credentials. (It canNOT be done
          # with sts:GetFederationToken, which AWS only lets an IAM user call.) Requesting the
          # OIDC token for that call also needs the id-token: write permission set above.
          #
          # The Google value is the JSON from the service account file exported from the HMS
          # Google account for the smaht-dac project; the service account email is
          # ga4-service-account@smaht-dac.iam.gserviceaccount.com;
          # its key ID is b488dd9cfde6b59b1aa347aabd9add86c7ff9057; it was created on 2024-04-28.
          AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
        run: |
          make test-integration
